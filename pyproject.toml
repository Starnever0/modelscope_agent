[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "modelscope-agent"
version = "0.1.0"
description = "LangGraph-based RAG assistant for ModelScope Q&A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-chroma",
    "chromadb",
    "dashscope>=1.14.0",
    "jieba",
    "rank_bm25",
    "gradio==5.49.1",
    "langgraph",
    "langchain_openai",
    "faiss_cpu",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "markdownify",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
